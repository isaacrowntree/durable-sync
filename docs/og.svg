<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- durable-sync: the log, printed on green-bar fanfold. Acked ops carry a
       seq; the queued one waits in the outbox below the perforation. -->
  <defs>
    <pattern id="holes" width="40" height="30" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="15" r="6.5" fill="#f6f8f4" stroke="#c3cbc2" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#f6f8f4"/>

  <!-- wordmark -->
  <text x="72" y="92" font-family="Atkinson Hyperlegible Mono, Menlo, monospace" font-size="26" font-weight="700" fill="#1c2230">durable<tspan fill="#1a6b45">-</tspan>sync</text>

  <!-- headline -->
  <text font-family="Atkinson Hyperlegible Next, Helvetica Neue, Helvetica, sans-serif" font-weight="800" fill="#1c2230" letter-spacing="-2">
    <tspan x="68" y="200" font-size="66">Offline-first sync for</tspan>
    <tspan x="68" y="274" font-size="66">Cloudflare Durable Objects</tspan>
  </text>
  <text x="72" y="330" font-family="Atkinson Hyperlegible Next, Helvetica Neue, Helvetica, sans-serif" font-size="26" fill="#4e5866">An append-only op log on the server, a durable outbox on the client.</text>

  <!-- the printout -->
  <rect x="72" y="372" width="760" height="258" fill="#fbfcf9" stroke="#c3cbc2"/>
  <rect x="72" y="372" width="40" height="258" fill="url(#holes)"/>
  <rect x="792" y="372" width="40" height="258" fill="url(#holes)"/>
  <line x1="112" y1="372" x2="112" y2="630" stroke="#dfe4dd" stroke-dasharray="4 4"/>
  <line x1="792" y1="372" x2="792" y2="630" stroke="#dfe4dd" stroke-dasharray="4 4"/>
  <rect x="113" y="392" width="678" height="44" fill="#e1eee3"/>

  <g font-family="Atkinson Hyperlegible Mono, Menlo, monospace" font-size="21">
    <text x="132" y="421"><tspan font-weight="700" fill="#1a6b45">003</tspan><tspan x="200" fill="#4e5866">set.logged</tspan><tspan x="360" fill="#1c2230">squat 5×5 @ 102.5kg</tspan></text>
    <text x="132" y="465"><tspan font-weight="700" fill="#1a6b45">004</tspan><tspan x="200" fill="#4e5866">note.added</tspan><tspan x="360" fill="#1c2230">felt heavy on the last rep</tspan></text>
  </g>
  <g font-family="Atkinson Hyperlegible Next, Helvetica, sans-serif" font-size="18" fill="#1a6b45" text-anchor="end">
    <text x="772" y="421">acked</text>
    <text x="772" y="465">acked</text>
  </g>

  <!-- perforation, then the outbox -->
  <rect x="72" y="490" width="760" height="140" fill="#f6f8f4"/>
  <line x1="72" y1="490" x2="832" y2="490" stroke="#c3cbc2" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="96" y="524" font-family="Atkinson Hyperlegible Next, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1c2230">Outbox, on the device</text>
  <text x="808" y="524" text-anchor="end" font-family="Atkinson Hyperlegible Next, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#9a4f08">1 queued</text>
  <rect x="96" y="544" width="712" height="46" rx="5" fill="#ffffff" stroke="#9a4f08" stroke-opacity="0.55" stroke-dasharray="5 4"/>
  <g font-family="Atkinson Hyperlegible Mono, Menlo, monospace" font-size="21">
    <text x="132" y="574"><tspan fill="#4e5866">–</tspan><tspan x="200" fill="#4e5866">set.logged</tspan><tspan x="360" fill="#9a4f08">bench 5×5 @ 60kg</tspan></text>
  </g>
  <text x="784" y="574" text-anchor="end" font-family="Atkinson Hyperlegible Next, Helvetica, sans-serif" font-size="18" fill="#9a4f08">pending</text>

  <!-- right rail -->
  <text x="876" y="416" font-family="Atkinson Hyperlegible Mono, Menlo, monospace" font-size="22" font-weight="700" fill="#1a6b45">npm i durable-sync</text>
  <g font-family="Atkinson Hyperlegible Next, Helvetica, sans-serif" font-size="22" fill="#4e5866">
    <text x="876" y="466">Zero dependencies</text>
    <text x="876" y="500">No Postgres</text>
    <text x="876" y="534">No container</text>
    <text x="876" y="568">MIT</text>
  </g>
</svg>
